[project]
name = "kv-quant"
version = "0.0.1"
description = "KV Cache Quantization with Provable Correctness Gates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0; sys_platform != 'win32'",
    "transformers>=4.44.0",
    "pydantic>=2.8.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "hypothesis>=6.108.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "types-PyYAML",
    "pandas-stubs",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.0",
    "hypothesis>=6.108.0",
    "ruff>=0.5.0",
    "mypy>=1.11.0",
    "types-PyYAML",
    "pandas-stubs",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["kv_quant", "scripts", "tests", "bench", "tasks", "sweeps"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "PTH", # flake8-use-pathlib
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "TRY003"]
"scripts/*" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "torch.*",
    "triton.*",
    "transformers.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "scripts.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "bench.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kv_quant.advisor"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kv_quant.kernels.dequant_fused"
ignore_errors = true

[[tool.mypy.overrides]]
module = "kv_quant.wrapper"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-x -q --strict-markers"
markers = [
    "slow: marks tests as slow",
    "gpu: marks tests requiring GPU",
    "parity: marks parity tests",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kv_quant*"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"