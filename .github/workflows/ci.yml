name: ci-matrix

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-cpu:
    name: CPU Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install frozen dependencies
        run: uv sync --frozen
      - name: Run Unit & Hypothesis Property Tests with Coverage
        run: uv run --with pytest-cov pytest -m "not gpu" --cov=kv_quant --cov-report=term-missing
      - name: Run Ruff Linter & Format Check
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Run Strict Mypy Typecheck
        run: uv run mypy kv_quant scripts tests
      - name: Run Layout Drift Gate
        run: uv run python scripts/check_layout_drift.py
      - name: Run No-Claims-Without-Artifact Gate
        run: uv run python scripts/check_claims.py
      - name: Run Figure Provenance Gate
        run: uv run python scripts/check_figure_provenance.py
      - name: Run Interactive Explorer Drift Gate
        run: uv run python scripts/check_explorer_drift.py
